name: Deploy (staging)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://homemade-staging.fly.dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
      FLY_IMAGE: registry.fly.io/homemade-staging:sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Authenticate Docker to Fly registry
        run: flyctl auth docker

      - name: Mirror image from GHCR to Fly registry
        run: |
          docker pull "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$FLY_IMAGE"
          docker push "$FLY_IMAGE"

      - name: Deploy to Fly (homemade-staging)
        run: |
          flyctl deploy \
            --config fly.staging.toml \
            --app homemade-staging \
            --image "$FLY_IMAGE" \
            --remote-only \
            --wait-timeout 600

      - name: Smoke test /health
        run: |
          for i in {1..20}; do
            if curl -fsS https://homemade-staging.fly.dev/health; then
              echo " - staging healthy"; exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed"; exit 1
