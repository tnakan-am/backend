name: Deploy (dev)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://homemade-dev.fly.dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly (homemade-dev)
        run: |
          flyctl deploy \
            --config fly.dev.toml \
            --app homemade-dev \
            --image "$IMAGE" \
            --remote-only \
            --wait-timeout 600

      - name: Smoke test /health
        run: |
          for i in {1..20}; do
            if curl -fsS https://homemade-dev.fly.dev/health; then
              echo " - dev healthy"; exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed"; exit 1
