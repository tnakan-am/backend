name: Deploy (prod)

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci-must-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI succeeded for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --workflow=ci.yml \
            --commit="$GITHUB_SHA" \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CI conclusion: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "CI has not succeeded on $GITHUB_SHA"; exit 1
          fi

  deploy:
    needs: ci-must-pass
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://homemade-prod.fly.dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly (homemade-prod)
        run: |
          flyctl deploy \
            --config fly.prod.toml \
            --app homemade-prod \
            --image "$IMAGE" \
            --remote-only \
            --wait-timeout 900

      - name: Smoke test /health
        run: |
          for i in {1..30}; do
            if curl -fsS https://homemade-prod.fly.dev/health; then
              echo " - prod healthy"; exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed. To roll back:"
          echo "  flyctl releases list -a homemade-prod"
          echo "  flyctl deploy --image <previous-image> -a homemade-prod"
          exit 1
