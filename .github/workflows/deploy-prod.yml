name: Deploy (prod)

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci-must-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Wait for CI on this SHA, then require success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            conclusion=$(gh run list \
              --workflow=ci.yml \
              --commit="$GITHUB_SHA" \
              --status=completed \
              --limit=1 \
              --json conclusion \
              --jq '.[0].conclusion // empty')
            if [ -n "$conclusion" ]; then
              echo "CI conclusion on $GITHUB_SHA: $conclusion"
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "CI failed on $GITHUB_SHA"
              exit 1
            fi
            echo "No completed CI run for $GITHUB_SHA yet, sleeping 30s..."
            sleep 30
          done
          echo "Timed out waiting for CI to complete on $GITHUB_SHA"
          exit 1

  deploy:
    needs: ci-must-pass
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://homemade-prod.fly.dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      FLY_IMAGE: registry.fly.io/homemade-prod:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Authenticate Docker to Fly registry
        run: flyctl auth docker

      - name: Capture currently-deployed image (for rollback)
        id: prev
        run: |
          prev=$(flyctl status --app homemade-prod --json 2>/dev/null | jq -r '.ImageRef // empty')
          echo "Current prod image: ${prev:-<none>}"
          echo "image=$prev" >> "$GITHUB_OUTPUT"

      - name: Mirror image from GHCR to Fly registry
        run: |
          docker pull "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$FLY_IMAGE"
          docker push "$FLY_IMAGE"

      - name: Deploy to Fly (homemade-prod)
        run: |
          flyctl deploy \
            --config fly.prod.toml \
            --app homemade-prod \
            --image "$FLY_IMAGE" \
            --remote-only \
            --wait-timeout 900

      - name: Smoke test /health
        run: |
          for i in {1..30}; do
            if curl -fsS https://homemade-prod.fly.dev/health; then
              echo " - prod healthy"; exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed"; exit 1

      - name: Roll back to previous release on failure
        if: failure() && steps.prev.outputs.image != ''
        run: |
          echo "Deploy/smoke failed — rolling prod back to ${{ steps.prev.outputs.image }}"
          flyctl deploy \
            --app homemade-prod \
            --image "${{ steps.prev.outputs.image }}" \
            --strategy immediate \
            --wait-timeout 900
          echo "Rollback complete."
