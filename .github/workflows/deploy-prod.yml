name: Deploy (prod)

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci-must-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI on this SHA, then require success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            conclusion=$(gh run list \
              --workflow=ci.yml \
              --commit="$GITHUB_SHA" \
              --status=completed \
              --limit=1 \
              --json conclusion \
              --jq '.[0].conclusion // empty')
            if [ -n "$conclusion" ]; then
              echo "CI conclusion on $GITHUB_SHA: $conclusion"
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "CI failed on $GITHUB_SHA"
              exit 1
            fi
            echo "No completed CI run for $GITHUB_SHA yet, sleeping 30s..."
            sleep 30
          done
          echo "Timed out waiting for CI to complete on $GITHUB_SHA"
          exit 1

  deploy:
    needs: ci-must-pass
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://homemade-prod.fly.dev
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      FLY_IMAGE: registry.fly.io/homemade-prod:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Authenticate Docker to Fly registry
        run: flyctl auth docker

      - name: Mirror image from GHCR to Fly registry
        run: |
          docker pull "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$FLY_IMAGE"
          docker push "$FLY_IMAGE"

      - name: Deploy to Fly (homemade-prod)
        run: |
          flyctl deploy \
            --config fly.prod.toml \
            --app homemade-prod \
            --image "$FLY_IMAGE" \
            --remote-only \
            --wait-timeout 900

      - name: Smoke test /health
        run: |
          for i in {1..30}; do
            if curl -fsS https://homemade-prod.fly.dev/health; then
              echo " - prod healthy"; exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed. To roll back:"
          echo "  flyctl releases list -a homemade-prod"
          echo "  flyctl deploy --image <previous-image> -a homemade-prod"
          exit 1
