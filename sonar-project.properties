# SonarCloud Configuration

# Organization and project keys
sonar.organization=your-org-name
sonar.projectKey=your-org-name_backend

# Project metadata
sonar.projectName=Backend API
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/*.js
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Language
sonar.language=ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/test/**,**/migrations/**,**/main.ts

# TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Duplication
sonar.cpd.exclusions=**/*.spec.ts,**/migrations/**

# Security Hotspots
sonar.security.hotspots.maxIssues=0

# Quality Gate
sonar.qualitygate.wait=true