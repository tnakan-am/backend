app = "homemade-staging"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "30s"

[env]
  NODE_ENV = "staging"
  PORT = "3000"
  DB_SSL = "false"

[deploy]
  release_command = "node node_modules/typeorm/cli.js migration:run -d dist/data-source.js"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "uploads"
  destination = "/usr/src/app/uploads"
