app = "homemade-prod"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_SSL = "false"

[deploy]
  release_command = "node node_modules/typeorm/cli.js migration:run -d dist/data-source.js"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
